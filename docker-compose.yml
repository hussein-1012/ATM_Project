name: aqrab-atm

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: ${PORT:-3000}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://aqrab:${POSTGRES_PASSWORD:-aqrab}@postgres:5432/${POSTGRES_DB:-aqrab}
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-32chars-min}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-32chars-min}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
  JWT_RESET_TTL: ${JWT_RESET_TTL:-10m}
  CORS_ORIGINS: ${CORS_ORIGINS:-*}
  THROTTLE_TTL: ${THROTTLE_TTL:-60000}
  THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
  AUTH_THROTTLE_TTL: ${AUTH_THROTTLE_TTL:-60000}
  AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-10}
  REPORT_THROTTLE_TTL: ${REPORT_THROTTLE_TTL:-60000}
  REPORT_THROTTLE_LIMIT: ${REPORT_THROTTLE_LIMIT:-5}
  OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
  OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
  OTP_COOLDOWN_SECONDS: ${OTP_COOLDOWN_SECONDS:-60}
  REPORT_COOLDOWN_MINUTES: ${REPORT_COOLDOWN_MINUTES:-30}
  REPORT_FRESH_HOURS: ${REPORT_FRESH_HOURS:-6}
  ROUTING_PROVIDER: ${ROUTING_PROVIDER:-fallback}
  OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
  ORS_API_KEY: ${ORS_API_KEY:-}
  ROUTE_CACHE_TTL_SECONDS: ${ROUTE_CACHE_TTL_SECONDS:-60}
  IMPORT_DEFAULT_FILE: data/atms.json

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aqrab}
      POSTGRES_USER: ${POSTGRES_USER:-aqrab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqrab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqrab} -d ${POSTGRES_DB:-aqrab}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: runs migrations then the idempotent ATM import, then exits.
  # `depends_on: condition: service_completed_successfully` gates the api on it.
  importer:
    build: .
    command: ["sh", "-c", "node dist/database/migrate.js && node dist/modules/importer/run-import.js --file data/atms.json"]
    environment:
      <<: *app-env
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      importer:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
